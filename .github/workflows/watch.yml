name: Watch Dune Part 3 IMAX 70mm

# ~2-minute effective polling, the way the Odyssey watch proved out:
# GitHub's cron is unreliable on this repo (measured 53-212 min between
# scheduled runs, median 98), so the cron is only a backstop that revives the
# chain. The real cadence comes from each run dispatching its successor and
# then sweeping every SWEEP_INTERVAL_SECONDS for RUN_MINUTES.
#
# The successor is dispatched at the START of the run, not the end: it sits
# queued behind this run's concurrency group and starts the moment this run
# ends — including when this run is killed by a lost runner or a timeout, the
# one case an end-of-run dispatch cannot survive. A crash-loop guard below
# stops the chain from spinning if the code itself is broken.
#
# Expect most SCHEDULED runs to show as "cancelled": while the chain is
# healthy, a queued cron run is displaced by the chain's own successor. That
# is by design and not a failure — chain (workflow_dispatch) runs are the
# ones doing the work. tools/health.py watches the real cadence daily.

on:
  schedule:
    - cron: "7,37 * * * *" # backstop only; odd minutes queue faster than :00/:30
  workflow_dispatch:
    inputs:
      test:
        description: "Set to 'true' for one [TEST] sweep + synthetic alert through all channels (no state commit, no chain)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # Test runs get their own lane so a manual test can never displace the
  # queued successor of the live chain.
  group: watch-${{ inputs.test != '' && 'test' || 'live' }}
  cancel-in-progress: false

env:
  NTFY_TOPIC: odyssey-imax-70mm-88955e30
  # Watch tuning. What alerts: GROUP_SIZE+ contiguous seats in one good row,
  # dead centre (best window midpoint within GROUP_CENTRE_TOLERANCE columns
  # of the row centre), on a time-eligible showtime. Weekday shows must start
  # in [WEEKDAY_EARLIEST_START, LATEST_START]; Sundays by LATEST_START;
  # Saturdays unrestricted. Changing any of these re-baselines seat
  # snapshots without alerting.
  GOOD_ROWS: "FGHIJ"
  GOOD_RADIUS: "6"
  GROUP_SIZE: "4"
  GROUP_CENTRE_TOLERANCE: "2"
  WEEKDAY_EARLIEST_START: "17:30"
  LATEST_START: "21:00"
  SWEEP_INTERVAL_SECONDS: "120"
  RUN_MINUTES: "25"
  ALERT_COOLDOWN_MINUTES: "90"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v4

      # Chain first — see the header comment. DISPATCH_PAT is a fine-grained
      # PAT with Actions:write (the mechanism the Odyssey watch ran 2,780 runs
      # on); the built-in token is tried as a fallback in case the PAT expires.
      - name: Dispatch the next run in the chain
        if: github.ref == 'refs/heads/main' && inputs.test == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          # Crash-loop guard: if the last 3 completed live runs all failed in
          # under 5 minutes and all started within the last 30 minutes, the
          # watcher itself is broken — stop chaining and let the cron backstop
          # (and the daily health check) take it from here. Real alert runs
          # also conclude "failure" on purpose, but they run ~25 minutes, so
          # they can never trip the duration test.
          RECENT=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/runs?status=completed&per_page=10" \
            | jq '[.workflow_runs[] | select(.conclusion != "cancelled")][:3]')
          LOOPING=$(echo "$RECENT" | jq --argjson now "$(date +%s)" '
            length == 3 and ([.[] | select(
              .conclusion == "failure"
              and ((.updated_at | fromdateiso8601) - (.run_started_at | fromdateiso8601)) < 300
              and ($now - (.run_started_at | fromdateiso8601)) < 1800
            )] | length) == 3')
          if [ "$LOOPING" = "true" ]; then
            echo "::error::crash-loop guard tripped — last 3 runs all failed fast; not dispatching a successor. Fix the watcher; the cron backstop keeps sparse coverage."
            exit 0
          fi

          dispatch() {
            curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X POST \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
              -d '{"ref":"main"}'
          }
          CODE=000
          if [ -n "$PAT" ]; then
            CODE=$(dispatch "$PAT") || CODE=000
          fi
          if [ "$CODE" != "204" ]; then
            echo "PAT dispatch returned $CODE — retrying with the built-in token"
            CODE=$(dispatch "$GH_TOKEN") || CODE=000
          fi
          if [ "$CODE" = "204" ]; then
            echo "successor dispatched (it waits in the concurrency queue until this run ends)"
          else
            echo "::error::could not dispatch the next run (HTTP $CODE) — DISPATCH_PAT may be expired. The cron backstop keeps sparse coverage; the daily health check will flag the dropped cadence."
          fi

      # The daily heartbeat must not depend on GitHub's cron: health.yml's
      # very first scheduled tick (2026-09-02 12:23) was silently dropped,
      # exactly the failure mode this repo's crons are known for. The chain
      # runs reliably every ~25 minutes, so the first chain run after the
      # heartbeat hour dispatches health.yml if nothing has run it today.
      # health.yml's own cron stays as a backstop; a dedupe guard in
      # tools/health.py keeps a late cron tick from double-sending.
      - name: Trigger the daily heartbeat if it has not run today
        if: github.ref == 'refs/heads/main' && inputs.test == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          [ "$(date -u +%H%M)" -ge 1223 ] || { echo "before heartbeat hour"; exit 0; }
          TODAY=$(date -u +%Y-%m-%d)
          N=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/health.yml/runs?created=%3E%3D${TODAY}T00:00:00Z&per_page=1" \
            | jq -r '.total_count')
          if [ "$N" = "0" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X POST \
              -H "Authorization: Bearer ${PAT:-$GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/health.yml/dispatches" \
              -d '{"ref":"main"}') || CODE=000
            echo "health.yml had not run today — dispatched (HTTP $CODE)"
          else
            echo "health.yml already ran today ($N run(s))"
          fi

      - name: Watch (sweep every ~2 min for ~25 min)
        id: watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          CINEPLEX_API_KEY: ${{ secrets.CINEPLEX_API_KEY }}
          # Any non-empty value of the test input means test mode, matching
          # every other condition in this file.
          CINEWATCHER_TEST: ${{ inputs.test != '' && '1' || '' }}
        run: python3 watcher.py

      # GitHub reliably emails on failed runs (and pushes via the mobile app
      # if Actions notifications are enabled there). After the in-run alerts
      # have gone out, fail the run on purpose: the "Run failed" email IS the
      # fourth alert channel. Never fires for [TEST] runs.
      - name: Fail loudly so GitHub sends a run-failed email
        if: always() && inputs.test == ''
        run: |
          [ -f result.json ] || exit 0
          if [ "$(jq -r '.alerts > 0' result.json)" = "true" ]; then
            echo "::error::🚨 DUNE: PART 3 IMAX 70MM — new showtimes or freed good seats were detected this run. This failure is intentional; it is your email alert. Telegram: $(jq -r '.telegram' result.json). Book: https://www.cineplex.com/Movie/dune-part-3"
            exit 1
          fi
