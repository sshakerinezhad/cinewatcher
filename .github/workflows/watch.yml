name: Watch Dune Part 3 IMAX 70mm

# Half-hourly watch. The Odyssey watch ran every ~5 minutes and had to
# self-chain via a PAT because GitHub's cron was unreliable; this one is not
# time-critical, so plain cron is enough. Note that GitHub deprioritises
# scheduled runs under load and skips them outright when a repo is inactive
# for 60 days — expect the occasional gap wider than 30 minutes.
on:
  schedule:
    # Every 30 minutes, deliberately off the hour. GitHub delays scheduled
    # runs when Actions is under load, and :00 and :30 — where a plain */30
    # lands — are the most contended minutes on the platform. Odd offsets
    # queue behind far less.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_date:
        description: "Override target date (YYYY-MM-DD) for an end-to-end alert test"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  # Test runs get their own lane. Sharing one group meant a manual test and a
  # chained production run could cancel each other while queued — a cancelled
  # production run also never chains its successor, which can stall the loop.
  group: watch-${{ inputs.test_date != '' && 'test' || 'live' }}
  cancel-in-progress: false

env:
  NTFY_TOPIC: odyssey-imax-70mm-88955e30

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # One check per run. The Odyssey watch checked three times per run to
      # tighten a 5-minute cron into ~2-minute polling; at a 30-minute cadence
      # that buys nothing, since a drop between checks waits for the next run
      # either way.
      - name: Check Cineplex showtimes
        id: check
        env:
          CINEWATCHER_DATE: ${{ inputs.test_date }}
        run: |
          python3 checker.py
          echo "alert=$(jq -r .alert result.json)" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -r .changed result.json)" >> "$GITHUB_OUTPUT"

      # Notifications fire FIRST so a later git failure can never block them.
      - name: Alert on new IMAX 70mm showtimes
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.test_date != '' && '[TEST] ' || '' }}
        run: |
          # Telegram push (primary channel). Secrets: TELEGRAM_BOT_TOKEN (from
          # @BotFather) and TELEGRAM_CHAT_ID (from @userinfobot).
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -sS --max-time 20 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text@alert.txt" || true
          fi

          # An alert only ever fires for IMAX 70mm sessions, so there is one
          # headline.
          HEAD="🚨 Dune: Part 3 IMAX 70mm tickets are UP (Dec 21)"

          # ntfy push (secondary; subscribe to the topic in the ntfy app)
          curl -sS --max-time 20 \
            -H "Title: ${PREFIX}${HEAD}" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,clapper" \
            --data-binary @alert.txt \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

          # GitHub issue with the full showtime list and buy links
          gh label create dune3-alert --color FF0000 --force || true
          existing=$(gh issue list --state open --label dune3-alert --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file alert.md
          else
            gh issue create \
              --title "${PREFIX}${HEAD}" \
              --label dune3-alert \
              --body-file alert.md
          fi

      - name: Commit status update
        if: steps.check.outputs.changed == 'true' && inputs.test_date == ''
        run: |
          git config user.name "cinewatcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "status: update showtime state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # GitHub reliably emails on failed runs (and pushes via the mobile app if
      # Actions notifications are enabled there) — unlike @mention
      # notifications, which are suppressed for self-triggered activity. After
      # all alerts have gone out, fail the run on purpose: the
      # "Run failed: Watch Odyssey IMAX 70mm" email IS the alert.
      - name: Fail loudly so GitHub sends a run-failed email
        if: always() && steps.check.outputs.alert == 'true'
        run: |
          echo "::error::🚨 DUNE: PART 3 IMAX 70MM TICKETS ARE UP FOR DEC 21 — this failure is intentional, it is your email alert. Book: https://www.cineplex.com/Movie/dune-part-3"
          exit 1
